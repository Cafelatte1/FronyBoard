[project]
name = "aira"
version = "0.8.1"
description = "FronyBoard — an MCP server that gives AI agents a first-class project tracker"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7",
    "mcp>=1.2.0",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.scripts]
aira = "aira.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aira"]
